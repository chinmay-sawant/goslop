# CodeHound Go — continuous integration
#
# tree-sitter Go bindings require CGO. Ubuntu runners need a C toolchain
# (build-essential provides gcc + libc headers).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Vet / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CGO is required for github.com/tree-sitter/go-tree-sitter + tree-sitter-go.
      - name: Install C build toolchain (CGO / tree-sitter)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: go mod download
        run: go mod download

      - name: go vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: go build
        env:
          CGO_ENABLED: "1"
        run: go build -o bin/codehound ./cmd/codehound

      - name: smoke --version / --list-rules
        run: |
          ./bin/codehound --version
          ./bin/codehound --list-rules | head -n 5
