# goslop — continuous integration
#
# Pure Go build (go/parser + go/ast). CGO is not required.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Vet / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: go build
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/goslop ./cmd/goslop

      - name: smoke --version / --list-rules
        run: |
          ./bin/goslop --version
          ./bin/goslop --list-rules | head -n 5
