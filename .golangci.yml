run:
  timeout: 5m

linters-settings:
  gocyclo:
    min-complexity: 30
  gocognit:
    min-complexity: 65
  cyclop:
    max-complexity: 30
  funlen:
    lines: 200
    statements: 120
  mnd:
    ignored-numbers:
      - "0"
      - "1"
      - "2"
      - "3"
      - "4"
      - "8"
      - "10"
      - "16"
      - "100"
      - "255"
      - "1000"
  gosec:
    excludes:
      - G115
      - G404
  govet:
    enable-all: true
    disable:
      - fieldalignment

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - gocognit
        - cyclop
        - funlen
    - path: sampledata/
      linters:
        - gocyclo
        - gocognit
        - cyclop
        - funlen

linters:
  enable:
    - asciicheck
    - bodyclose
    - cyclop
    - decorder
    - dupword
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - gosec
    - ineffassign
    - interfacebloat
    - makezero
    - misspell
    - mnd
    - nestif
    - nilerr
    - nilnil
    - nolintlint
    - nonamedreturns
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - staticcheck
    - stylecheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
